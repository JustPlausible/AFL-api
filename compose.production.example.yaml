# Production-like example for one carefully operated, SQLite-backed instance.
# AFL_API_TAG is operator-selected; replace this example default with the
# reviewed release or commit identifier recorded for the deployment.
x-afl-image: &afl-image
  image: "${AFL_API_IMAGE:-afl-api}:${AFL_API_TAG:-0.7.0-example}"

name: afl-api

services:
  afl-api:
    <<: *afl-image
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    ports:
      - "${AFL_API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      DB_PATH: "${DB_PATH:-/app/data/afl_players.db}"
    volumes:
      - afl-api-data:/app/data
      - afl-api-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  afl-admin:
    <<: *afl-image
    command: uvicorn admin:app --host 0.0.0.0 --port 8001
    ports:
      - "${AFL_ADMIN_PORT:-8001}:8001"
    env_file:
      - .env
    environment:
      DB_PATH: "${DB_PATH:-/app/data/afl_players.db}"
    volumes:
      - afl-api-data:/app/data
      - afl-api-logs:/app/logs
    restart: unless-stopped
    networks:
      - management
      - admin-access

  afl-scheduler:
    <<: *afl-image
    command: uvicorn scheduler.start:app --host 0.0.0.0 --port 8000
    env_file:
      - .env
    environment:
      DB_PATH: "${DB_PATH:-/app/data/afl_players.db}"
      # SQLite supports exactly one Scheduler replica. This startup assertion
      # is deliberately not a distributed lock.
      AFL_SCHEDULER_REPLICAS: "1"
      PYTHONUNBUFFERED: "1"
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    volumes:
      # Mount the containing directory: SQLite WAL and SHM sidecars must live
      # beside the database. Drain/stop Scheduler writers for restore/cold copy.
      - afl-api-data:/app/data
      - afl-api-logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/readyz', timeout=2).read()\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - management
      - scheduler-egress

volumes:
  afl-api-data:
  afl-api-logs:

networks:
  default:
    driver: bridge
  management:
    driver: bridge
    internal: true
  admin-access:
    driver: bridge
  scheduler-egress:
    driver: bridge
